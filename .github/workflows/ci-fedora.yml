name: ProofPower CI Fedora

on:
  workflow_dispatch:

jobs:
  build-test-fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          dnf update -y
          dnf install -y polyml polyml-doc texlive texlive-epsf motif motif-devel groff mkfontdir xfig git gawk xmodmap redhat-rpm-config glibc-langpack-en
      - name: Generate locale
        run: |
          localedef -i en_US -f ISO-8859-1 en_US.ISO-8859-1
      - name: Build all packages
        run: |
          export PPDIR=`pwd`
          export LANG=en_US.ISO-8859-1
          export LC_ALL=en_US.ISO-8859-1
          cd src && make all
      - name: Run tests
        run: |
          export LANG=en_US.ISO-8859-1
          export LC_ALL=en_US.ISO-8859-1
          cd src && make testreport