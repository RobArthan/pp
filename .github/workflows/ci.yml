name: ProofPower CI

on:
  workflow_dispatch:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y polyml libpolyml-dev texlive texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra libmotif-dev xfig groff xfonts-utils x11-xserver-utils git gawk csh
      - name: Build and test all packages with documentation
        run: |
          export PPDIR=`pwd`
          cd src && make all
      - name: Run testreport
        run: |
          echo $PATH
          echo $PPDIR
          cd src && make testreport
